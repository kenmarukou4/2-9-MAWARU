<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2-9 MAWARU ランキング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;800;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F4F7FC; --ink:#09152B; --blue:#1463FF; --gold:#FFD43B; --cyan:#25D6E9;
  --green:#0B806B; --red:#D92D3A; --line:#C8D2E2; --fill:#E4E9F1; --sub:#53647E;
  --score:#0A45C2; --paleGreen:#DDF7EF; --paleGold:#FFF4B8;
  --shadow:0 12px 28px rgba(6,17,38,.14);
  --sans:"Noto Sans JP","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  --mono:"Roboto Mono","SF Mono",Menlo,Consolas,"Liberation Mono","Noto Sans JP","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--ink);overflow:hidden;cursor:default}
#stage{
  position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;
  transform-origin:50% 50%;background:var(--canvas);color:var(--ink);font-family:var(--sans);
  overflow:hidden;user-select:none;-webkit-user-select:none;
}
.hdr{position:absolute;left:0;top:0;width:1920px;height:128px;background:var(--ink);color:#fff}
.brand{position:absolute;left:64px;top:38px;height:52px;display:flex;align-items:center;gap:16px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--gold);display:grid;place-items:center}
.brand-name{font:900 28px/1 var(--sans);letter-spacing:.02em}
.hdr h1{position:absolute;left:0;top:0;width:1920px;height:128px;display:flex;align-items:center;justify-content:center;font:900 56px/1 var(--sans);pointer-events:none}
.tag{position:absolute;right:64px;top:0;height:128px;display:flex;align-items:center;color:var(--cyan);font:800 24px/1 var(--sans)}

.view{position:absolute;left:0;top:128px;width:1920px;height:952px;padding:28px 64px 0;display:flex;flex-direction:column}
.info{height:44px;display:flex;align-items:center;justify-content:space-between;flex:none}
.challenge{font:800 28px/1 var(--sans)}
.badge{height:44px;width:160px;border-radius:22px;background:var(--paleGreen);color:var(--green);display:flex;align-items:center;padding-left:18px;gap:12px;font:800 20px/1 var(--sans)}
.badge i{width:14px;height:14px;border-radius:7px;background:var(--green);flex:none}
.cols,.row{display:grid;grid-template-columns:170px 1fr 78px 248px;align-items:center}
.cols{margin-top:24px;height:32px;padding:0 30px;font:700 20px/1 var(--sans);color:var(--sub);flex:none}
.cols span:last-child{text-align:right}
.list{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:8px;flex:none}
.row{height:66px;padding:0 28px;border-radius:16px;background:#fff;border:2px solid var(--line)}
.row .rk{font:700 28px/1 var(--mono);display:flex;align-items:center}
.row .nm{font:800 28px/1.2 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:16px}
.row .sc{text-align:right;font:700 32px/1 var(--mono);color:var(--score);white-space:nowrap}
.pill{display:inline-block;width:78px;height:34px;border-radius:17px;background:var(--blue);color:#fff;text-align:center;font:900 20px/34px var(--sans)}
.row.new{background:var(--paleGold);border-color:var(--gold)}
.row.first{height:92px;background:var(--gold);border-color:var(--gold);box-shadow:var(--shadow)}
.row.first .rk{font-size:48px;gap:22px}
.row.first .crown{display:block;width:48px;height:48px;color:var(--ink)}
.row.first .nm{font-size:42px;font-weight:900}
.row.first .sc{font-size:56px;color:var(--ink)}
.empty{flex:none;height:730px;margin-top:24px;background:#fff;border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center}
.empty h2{margin-top:40px;font:900 48px/1.2 var(--sans)}
.empty p{margin-top:24px;font:700 24px/1.4 var(--sans);color:var(--sub)}

/* 通信状態（問題があるときだけ表示） */
.net{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);height:40px;padding:0 26px;border-radius:20px;display:flex;align-items:center;gap:12px;font:800 20px/1 var(--sans);white-space:nowrap;box-shadow:var(--shadow);z-index:5}
.net i{width:14px;height:14px;border-radius:7px;flex:none}
.net.off{background:var(--red);color:#fff}.net.off i{background:#fff}
.net.demo{background:var(--gold);color:var(--ink)}.net.demo i{background:var(--ink)}
</style>
</head>
<body>
<div id="stage">
  <header class="hdr">
    <div class="brand"><span class="logo" id="logo"></span><span class="brand-name">2-9 MAWARU</span></div>
    <h1>今日のランキング</h1>
    <span class="tag">文化祭 SPECIAL GAME</span>
  </header>

  <main class="view">
    <div class="info">
      <div class="challenge">これまでの挑戦　<span id="cnt">0</span>人</div>
      <div class="badge"><i></i>本日の記録</div>
    </div>
    <div class="cols" id="cols" hidden><span>順位</span><span>名前</span><span></span><span>得点</span></div>
    <ol class="list" id="list" hidden></ol>
    <section class="empty" id="empty" hidden>
      <span id="icoSpark"></span>
      <h2>最初の記録をつくろう！</h2>
      <p>チャレンジが終わったら、得点を入力してください。</p>
    </section>
  </main>

  <div class="net" id="net" hidden role="status"><i></i><span id="netText"></span></div>
</div>

<script src="firebase-config.js"></script>
<script src="backend.js"></script>
<script>
(function(){
'use strict';
var B = window.Backend;
var CACHE = 'bs_display_cache_v5', NEW_MS = 5 * 60 * 1000, OFFLINE_DELAY = 4000;

var ICON = {
  crown:'<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><path d="M5 36L2.5 14L14 24L24 8L34 24L45.5 14L43 36Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><rect x="6" y="40" width="36" height="5" rx="2.5" fill="currentColor"/></svg>',
  logo:'<svg width="32" height="32" viewBox="-16 -16 32 32" aria-hidden="true" fill="none" stroke="#09152B" stroke-width="2.6" stroke-linecap="round"><circle r="12.5"/><path d="M-3.75 -3.75L3.75 3.75M3.75 -3.75L-3.75 3.75"/></svg>',
  spark:'<svg width="100" height="100" viewBox="2947 443.5 105 105" aria-hidden="true"><path d="M3040 445.506V465.505M3050 455.505H3030M2995.08 449.578C2995.3 448.431 2995.91 447.395 2996.81 446.65C2997.7 445.904 2998.83 445.496 3000 445.496C3001.17 445.496 3002.3 445.904 3003.19 446.65C3004.09 447.395 3004.7 448.431 3004.92 449.578L3010.17 477.367C3010.54 479.342 3011.5 481.16 3012.93 482.581C3014.35 484.003 3016.17 484.963 3018.14 485.336L3045.93 490.591C3047.08 490.805 3048.12 491.414 3048.86 492.312C3049.61 493.209 3050.02 494.339 3050.02 495.506C3050.02 496.673 3049.61 497.803 3048.86 498.7C3048.12 499.598 3047.08 500.207 3045.93 500.421L3018.14 505.676C3016.17 506.049 3014.35 507.009 3012.93 508.431C3011.5 509.852 3010.54 511.67 3010.17 513.645L3004.92 541.434C3004.7 542.581 3004.09 543.617 3003.19 544.362C3002.3 545.108 3001.17 545.516 3000 545.516C2998.83 545.516 2997.7 545.108 2996.81 544.362C2995.91 543.617 2995.3 542.581 2995.08 541.434L2989.83 513.645C2989.46 511.67 2988.5 509.852 2987.07 508.431C2985.65 507.009 2983.83 506.049 2981.86 505.676L2954.07 500.421C2952.92 500.207 2951.88 499.598 2951.14 498.7C2950.39 497.803 2949.98 496.673 2949.98 495.506C2949.98 494.339 2950.39 493.209 2951.14 492.312C2951.88 491.414 2952.92 490.805 2954.07 490.591L2981.86 485.336C2983.83 484.963 2985.65 484.003 2987.07 482.581C2988.5 481.16 2989.46 479.342 2989.83 477.367L2995.08 449.578ZM2970 535.502C2970 541.025 2965.52 545.502 2960 545.502C2954.47 545.502 2950 541.025 2950 535.502C2950 529.98 2954.47 525.503 2960 525.503C2965.52 525.503 2970 529.98 2970 535.502Z" fill="none" stroke="#1463FF" stroke-width="2.6" stroke-linecap="round"/></svg>'
};
function $(id){ return document.getElementById(id); }
function h(tag, props, kids){
  var e = document.createElement(tag);
  for (var k in (props || {})){
    var v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;     /* 固定のアイコンにだけ使用 */
    else e.setAttribute(k, v);
  }
  (kids || []).forEach(function(c){ e.appendChild(c); });
  return e;
}
function fit(){ $('stage').style.transform = 'scale(' + Math.min(innerWidth / 1920, innerHeight / 1080) + ')'; }
addEventListener('resize', fit); fit();
$('logo').innerHTML = ICON.logo; $('icoSpark').innerHTML = ICON.spark;

/* ---------- 状態 ---------- */
var records = [], loaded = false;
try {
  var c = JSON.parse(localStorage.getItem(CACHE));
  if (Array.isArray(c)) { records = c; loaded = true; }
} catch (e) {}

function ranked(){ return records.slice().sort(function(a, b){ return b.score - a.score || a.at - b.at; }); }
function newestId(){
  var best = null;
  records.forEach(function(r){ if (!best || r.at > best.at) best = r; });
  return best && best.at && B.serverNow() - best.at < NEW_MS ? best.id : null;
}
function rowEl(r, i, isNew){
  var rk = i === 0
    ? h('div', { class: 'rk' }, [h('span', { class: 'crown', html: ICON.crown, 'aria-hidden': 'true' }), h('span', { text: '1' })])
    : h('div', { class: 'rk', text: String(i + 1) });
  return h('li', { class: 'row' + (i === 0 ? ' first' : '') + (isNew ? ' new' : '') }, [
    rk,
    h('div', { class: 'nm', text: r.name }),
    h('div', {}, isNew ? [h('span', { class: 'pill', text: 'NEW!' })] : []),
    h('div', { class: 'sc', text: r.score + '点' })
  ]);
}
var shownNew = null;
function render(){
  var has = records.length > 0;
  $('cnt').textContent = String(records.length);
  $('cols').hidden = !has; $('list').hidden = !has;
  $('empty').hidden = has || !loaded;
  var list = $('list'); list.textContent = '';
  var nid = newestId(); shownNew = nid;
  ranked().slice(0, 10).forEach(function(r, i){ list.appendChild(rowEl(r, i, r.id === nid)); });
}
setInterval(function(){ if (newestId() !== shownNew) render(); }, 15000);

/* ---------- 通信状態の表示 ---------- */
var offTimer = null, fatalMsg = '';
function showNet(kind, text){
  var n = $('net'); n.hidden = false; n.className = 'net ' + kind; $('netText').textContent = text;
}
function hideNet(){ $('net').hidden = true; }
function refreshDemoBadge(){ if (B.mode === 'demo' && !fatalMsg) showNet('demo', 'デモ表示（Firebase未接続。このブラウザ内のみ）'); }
B.onConnection(function(ok){
  clearTimeout(offTimer);
  if (ok) { if (!fatalMsg) { hideNet(); refreshDemoBadge(); } return; }
  offTimer = setTimeout(function(){ if (!fatalMsg) showNet('off', '通信が切れています。表示は最後に受信した状態です'); }, OFFLINE_DELAY);
});
B.onError(function(e){
  fatalMsg = B.isPermission(e) ? '読み取りが許可されていません。データベースのルールを確認してください' : '通信エラー: ' + ((e && e.message) || e);
  showNet('off', fatalMsg);
});

/* ---------- 起動 ---------- */
refreshDemoBadge();
render();
B.init({ auth: false }).then(function(){
  B.onRecords(function(list){
    records = list; loaded = true;
    try { localStorage.setItem(CACHE, JSON.stringify(list)); } catch (e) {}
    render();
  });
}).catch(function(e){
  fatalMsg = 'Firebaseに接続できません。通信とfirebase-config.jsを確認してください';
  showNet('off', fatalMsg);
});
})();
</script>
</body>
</html>
